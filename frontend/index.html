<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JWT Authentication Demo</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 16px}
    form{border:1px solid #ddd;padding:20px;margin:16px 0;border-radius:8px}
    input,button{display:block;width:100%;box-sizing:border-box;padding:10px;margin:8px 0}
    button{cursor:pointer}.status{padding:12px;background:#f4f4f4;border-radius:6px;white-space:pre-wrap}
  </style>
</head>
<body>
  <h1>JWT Authentication Demo</h1>
  <form id="register">
    <h2>Register</h2>
    <input name="username" placeholder="Username" minlength="3" required>
    <input name="password" type="password" placeholder="Password (8+ characters)" minlength="8" required>
    <button>Register</button>
  </form>
  <form id="login">
    <h2>Login</h2>
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button>Login</button>
  </form>
  <button id="me">Call /auth/me</button>
  <button id="protected">Call protected API</button>
  <button id="logout">Logout</button>
  <div id="status" class="status">Not authenticated.</div>
  <script src="/frontend/app.js"></script>
</body>
</html>
